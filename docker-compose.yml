version: '3.8'

services:
  db:
    image: postgres:14
    container_name: risk-novelty-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-risk_novelty}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Initialize schema on first container init
      - ./sql:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:


